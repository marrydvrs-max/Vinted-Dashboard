<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09b1ba">
<title>Reseller Dashboard</title>
<style>
:root{--teal:#09b1ba;--teal-d:#007782;--teal-l:#e6f7f8;--bg:#f6f6f6;--card:#fff;--tx:#171717;--mu:#6a6a6a;--ln:#e4e4e4;--grn:#2e9e5b;--red:#d6453d;--org:#f2994a;color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Vinted Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu)}.s{font-size:12.5px}.pos{color:var(--grn)}.neg{color:var(--red)}
header{background:#fff;border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--teal-d)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:15px}
.link{color:var(--teal-d);font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px))}
.btn{background:var(--teal);color:#fff;border-radius:4px;padding:11px 16px;font-weight:600}
.btn:hover{background:var(--teal-d)}.btn:disabled{opacity:.6}
.btn.o{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}.btn.o:hover{background:var(--teal-l)}
.btn.d{background:#fff;color:var(--red);border:1px solid var(--red)}.btn.d.arm{background:var(--red);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:var(--teal)}.tl{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.tv{font-size:21px;font-weight:700}.ts{font-size:12.5px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:20px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#chart{overflow-x:auto}#chart svg{width:100%;min-width:460px;height:auto;display:block}
.gl{stroke:var(--ln)}.ax{fill:var(--mu);font-size:11px}.cur{stroke:var(--mu);stroke-dasharray:3 3}.hit{fill:transparent;cursor:pointer}
#readout{margin-top:6px;min-height:20px;font-size:13px}
.mt .r{display:grid;grid-template-columns:70px 1fr 1fr 80px;gap:6px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px;align-items:center}
.mt .r:first-child{border-top:0}.mt .h{color:var(--mu);font-size:11.5px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--ln);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.item:hover{border-color:var(--teal)}
.img{aspect-ratio:1;background:var(--teal-l);display:grid;place-items:center;font-size:40px}.img img{width:100%;height:100%;object-fit:cover}
.it{padding:8px 10px 0;font-weight:600;font-size:14px;overflow-wrap:anywhere}.im{padding:2px 10px 10px;font-size:13px;color:var(--mu)}
.badge{font-size:11.5px;background:var(--teal-l);color:var(--teal-d);border-radius:20px;padding:2px 8px}.badge.w{background:#fdf0e2;color:#b65f0c}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--teal);color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);padding:4px 14px}
nav button span{font-size:20px}nav button.on{color:var(--teal-d);font-weight:700}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input{width:100%;min-width:0;background:#fff;border:1px solid #c9c9c9;border-radius:4px;padding:10px;font:inherit;color:var(--tx)}
input:focus{outline:2px solid var(--teal);border-color:transparent}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){#modal{align-items:center}.sheet{border-radius:14px}}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1}
#prev{margin-top:8px;display:flex;gap:10px;align-items:center}#prev img{width:64px;height:64px;object-fit:cover;border-radius:6px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:100%;max-width:380px;padding:22px}
#login input{margin-bottom:12px}#msg{color:var(--red);font-size:13px;margin-bottom:10px;min-height:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:#171717;color:#fff;border-radius:6px;padding:10px 14px;font-size:14px;z-index:20;max-width:90%}
</style></head><body>

<div id="login" hidden><div class="card">
<div class="brand" style="margin-bottom:14px"><span class="dot">€</span>Reseller Dashboard</div>
<div id="setup" class="mu s" hidden style="margin-bottom:10px">Bitte oben in der Datei SUPABASE_URL und SUPABASE_KEY eintragen.</div>
<label for="em">E-Mail</label><input id="em" type="email" autocomplete="email">
<label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password">
<div id="msg"></div>
<button id="go" class="btn" style="width:100%">Anmelden</button>
<p class="s" style="text-align:center;margin:12px 0 0"><button id="sw" class="link">Noch kein Konto? Registrieren</button></p>
</div></div>

<div id="app" hidden>
<header><div class="brand"><span class="dot">€</span>Dashboard</div><button id="out" class="link">Abmelden</button></header>
<main id="view"></main>
<button id="fab" aria-label="Neuer Artikel">+</button>
<nav id="nav">
<button data-v="home"><span>🏠</span>Übersicht</button><button data-v="stock"><span>📦</span>Bestand</button>
<button data-v="sold"><span>✅</span>Verkauft</button><button data-v="stats"><span>📈</span>Statistik</button>
</nav></div>

<div id="modal" hidden><div class="sheet">
<h2 id="mt">Neuer Artikel</h2>
<div class="fg">
<div class="full"><label for="name">Artikel</label><input id="name" placeholder="z. B. Levi’s 512 Gr. 32"></div>
<div><label for="buy">Einkaufspreis (€)</label><input id="buy" inputmode="decimal" placeholder="0,00"></div>
<div><label for="bDate">Gekauft am</label><input id="bDate" type="date"></div>
<div class="full"><label for="extra">Extra-Kosten (€): Versand, Verpackung, Gebühren</label><input id="extra" inputmode="decimal" placeholder="0,00"></div>
<div><label for="sell">Verkaufspreis (€), leer = im Bestand</label><input id="sell" inputmode="decimal" placeholder="0,00"></div>
<div><label for="sDate">Verkauft am</label><input id="sDate" type="date"></div>
<div class="full"><label for="file">Bild (optional)</label><input id="file" type="file" accept="image/*">
<div id="prev" hidden><img id="pimg" alt=""><button id="rm" class="link">Bild entfernen</button></div></div>
</div>
<div class="acts"><button id="save" class="btn">Speichern</button><button id="del" class="btn d" hidden>Löschen</button><button id="cx" class="btn o">Abbrechen</button></div>
</div></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://yylyqmeqpwerdnbzjhuu.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bHlxbWVxcHdlcmRuYnpqaHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzODI5NTIsImV4cCI6MjEwNzk1ODk1Mn0.14yuMjXGCZoWAwS-_-ks3PE9S9xdBGroudu7ZDNEAto';
const $=id=>document.getElementById(id);
const eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const f=v=>eur.format(v);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fd=d=>{if(!d)return'';const[p,m,t]=d.split('-');return t+'.'+m+'.'+p.slice(2)};
const ALL=['rev','sp','pr'];
const NAMES={rev:'Verkauft (Umsatz)',sp:'Gekauft (Ausgaben)',pr:'Gewinn'};
const COL={rev:'#09b1ba',sp:'#f2994a',pr:'#2e9e5b'};
let sb,user=null,items=[],view='home',sel=new Set(ALL),rng=12,editing=null,armed=false,rmImg=false,curImg=null,authMode='in',tt;

function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3500)}

/* ---------- Login ---------- */
function showLogin(){$('app').hidden=true;$('login').hidden=false}
$('sw').onclick=()=>{authMode=authMode==='in'?'up':'in';$('go').textContent=authMode==='in'?'Anmelden':'Registrieren';$('sw').textContent=authMode==='in'?'Noch kein Konto? Registrieren':'Schon ein Konto? Anmelden';$('msg').textContent=''};
$('go').onclick=async()=>{
  if(!sb)return;$('msg').textContent='';$('go').disabled=true;
  const c={email:$('em').value.trim(),password:$('pw').value};
  const{data,error}=authMode==='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
  $('go').disabled=false;
  if(error)$('msg').textContent=error.message;
  else if(authMode==='up'&&!data.session)$('msg').textContent='Bitte bestätige die E-Mail und melde dich dann an.';
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('out').onclick=()=>sb.auth.signOut();

async function boot(session){
  user=session.user;$('login').hidden=true;$('app').hidden=false;
  await load();render();
}
async function load(){
  const{data,error}=await sb.from('items').select('*').order('b_date',{ascending:false});
  if(error){toast('Laden fehlgeschlagen: '+error.message);return}
  items=data.map(i=>({...i,buy:+i.buy,extra:+i.extra,sell:i.sell==null?null:+i.sell}));
}

/* ---------- Auswertung ---------- */
function calc(){
  let rev=0,spent=0,profit=0,sold=0,inv=0,invN=0;const days=[];
  for(const i of items){const c=i.buy+i.extra;spent+=c;
    if(i.sell!=null){rev+=i.sell;profit+=i.sell-c;sold++;if(i.s_date){const d=dayDiff(i.b_date,i.s_date);if(d>=0)days.push(d)}}
    else{inv+=c;invN++}}
  return{rev,spent,profit,sold,inv,invN,margin:rev?profit/rev*100:0,
    avgD:days.length?Math.round(days.reduce((a,b)=>a+b,0)/days.length)+' Tage':'–'};
}
function months(){
  const m={},g=k=>m[k]||(m[k]={rev:0,sp:0,pr:0,nb:0,ns:0});
  for(const i of items){const c=i.buy+i.extra;
    if(i.b_date){const o=g(i.b_date.slice(0,7));o.sp+=c;o.nb++}
    if(i.sell!=null&&i.s_date){const o=g(i.s_date.slice(0,7));o.rev+=i.sell;o.pr+=i.sell-c;o.ns++}}
  const ks=Object.keys(m).sort();if(!ks.length)return[];
  const end=[ks[ks.length-1],today().slice(0,7)].sort()[1],S=[];
  let[yy,mo]=ks[0].split('-').map(Number);
  for(let n=0;n<120;n++){const k=yy+'-'+String(mo).padStart(2,'0');S.push({k,...(m[k]||{rev:0,sp:0,pr:0,nb:0,ns:0})});if(k>=end)break;if(++mo>12){mo=1;yy++}}
  return rng?S.slice(-rng):S;
}

/* ---------- Ansichten ---------- */
const tile=(go,l,v,s,c='')=>`<button class="tile" data-go="${go}"><span class="tl">${l}</span><span class="tv ${c}">${v}</span><span class="ts">${s}</span></button>`;
function card(i){
  const c=i.buy+i.extra,s=i.sell!=null;let info;
  if(s){const p=i.sell-c;info=`<b class="${p>=0?'pos':'neg'}">${p>=0?'+':''}${f(p)}</b> · ${f(i.sell)}`}
  else{const d=dayDiff(i.b_date,today());info=`${f(c)} <span class="badge ${d>30?'w':''}">${d>30?'Ladenhüter · ':''}${d} T.</span>`}
  return `<button class="item" data-open="${i.id}"><div class="img">${i.image?`<img src="${esc(i.image)}" loading="lazy" alt="">`:'👖'}</div><div class="it">${esc(i.name)}</div><div class="im">${info}</div></button>`;
}
function vHome(){
  const k=calc();
  return `<h2>Übersicht</h2><div class="tiles">
${tile('stock','Bestand',k.invN+' Teile',f(k.inv)+' gebunden')}
${tile('sold','Verkauft',k.sold+' Teile','Ø Dauer '+k.avgD)}
${tile('st:rev','Umsatz',f(k.rev),'Verlauf ansehen')}
${tile('st:sp','Ausgaben',f(k.spent),'Verlauf ansehen')}
${tile('st:pr','Gewinn',f(k.profit),'Marge '+k.margin.toFixed(1).replace('.',',')+' %',k.profit>=0?'pos':'neg')}
${tile('st:all','Statistik','Alles','Gekauft, verkauft, Gewinn')}</div>`;
}
function vList(sold){
  const a=items.filter(i=>(i.sell!=null)===sold).sort((p,q)=>(sold?q.s_date||'':q.b_date||'').localeCompare(sold?p.s_date||'':p.b_date||''));
  return `<h2>${sold?'Verkauft':'Bestand'} <span class="mu s">(${a.length})</span></h2>`+(a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty">${sold?'Noch nichts verkauft.':'Dein Bestand ist leer. Tippe auf + um einen Artikel hinzuzufügen.'}</div>`);
}
function vStats(){
  const S=months();
  const chip=(a,k,l,on)=>`<button class="chip ${on?'on':''}" data-${a}="${k}">${l}</button>`;
  const rows=[...S].reverse().map(p=>`<div class="r"><b>${p.k.slice(5)}/${p.k.slice(0,4)}</b><span>Gekauft<br>${p.nb} · ${f(p.sp)}</span><span>Verkauft<br>${p.ns} · ${f(p.rev)}</span><b class="${p.pr>=0?'pos':'neg'}">${f(p.pr)}</b></div>`).join('');
  return `<h2>Statistik</h2>
<div class="chips">${chip('ch','all','Alle',sel.size===3)}${chip('ch','sp','Gekauft',sel.has('sp')&&sel.size<3)}${chip('ch','rev','Verkauft',sel.has('rev')&&sel.size<3)}${chip('ch','pr','Gewinn',sel.has('pr')&&sel.size<3)}</div>
<div class="card"><div id="chart"></div><div id="readout"></div></div>
<div class="chips">${chip('rg','6','6 Monate',rng===6)}${chip('rg','12','12 Monate',rng===12)}${chip('rg','0','Alles',rng===0)}</div>
<div class="card mt"><h3>Monatsübersicht</h3><div class="r h"><span>Monat</span><span>Käufe</span><span>Verkäufe</span><span>Gewinn</span></div>${rows||'<p class="mu">Noch keine Daten.</p>'}</div>`;
}
function chart(){
  const S=months(),el=$('chart');
  if(!S.length){el.innerHTML='<p class="mu">Noch keine Daten. Trage einen Artikel ein.</p>';return}
  const keys=ALL.filter(k=>sel.has(k)),W=640,H=250,L=52,R=14,T=14,B=28;
  const all=S.flatMap(p=>keys.map(k=>p[k])),lo=Math.min(0,...all),hi=Math.max(1,...all);
  const x=i=>S.length===1?(L+W-R)/2:L+i*(W-L-R)/(S.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf pro Monat">`;
  for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)} €</text>`}
  const st=Math.ceil(S.length/8);
  S.forEach((p,i)=>{if(i%st===0)s+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${p.k.slice(5)}/${p.k.slice(2,4)}</text>`});
  s+=`<line id="cur" class="cur" y1="${T}" y2="${H-B}" x1="-9" x2="-9"/>`;
  for(const k of keys){s+=`<polyline fill="none" stroke="${COL[k]}" stroke-width="2.5" stroke-linejoin="round" points="${S.map((p,i)=>x(i)+','+y(p[k])).join(' ')}"/>`+S.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[k])}" r="4.5" fill="${COL[k]}" stroke="#fff" stroke-width="2"/>`).join('')}
  const cw=(W-L-R)/Math.max(S.length-1,1);
  S.forEach((p,i)=>{s+=`<rect class="hit" data-i="${i}" x="${x(i)-cw/2}" y="${T}" width="${cw}" height="${H-T-B}"/>`});
  el.innerHTML=s+'</svg>';
  const show=i=>{const p=S[i];$('cur').setAttribute('x1',x(i));$('cur').setAttribute('x2',x(i));
    $('readout').innerHTML=`<b>${p.k.slice(5)}/${p.k.slice(0,4)}</b> · `+keys.map(k=>`<span style="color:${k==='rev'?'#007782':k==='sp'?'#b65f0c':'#2e9e5b'}">${NAMES[k]} ${f(p[k])}${k==='sp'?' ('+p.nb+')':k==='rev'?' ('+p.ns+')':''}</span>`).join(' · ')};
  el.querySelectorAll('.hit').forEach(r=>{const h=()=>show(+r.dataset.i);r.addEventListener('pointerenter',h);r.addEventListener('pointerdown',h)});
  show(S.length-1);
}
function render(){
  $('view').innerHTML=view==='home'?vHome():view==='stats'?vStats():vList(view==='sold');
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(view==='stats')chart();
}
$('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render();scrollTo(0,0)}};
$('view').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go){if(d.go.startsWith('st:')){const k=d.go.slice(3);sel=new Set(k==='all'?ALL:[k]);view='stats'}else view=d.go;render();scrollTo(0,0)}
  else if(d.open)openModal(d.open);
  else if(d.ch){const k=d.ch;if(k==='all')sel=new Set(ALL);else{sel.has(k)&&sel.size===3?sel=new Set([k]):sel.has(k)?sel.delete(k):sel.add(k);if(!sel.size)sel=new Set(ALL)}render()}
  else if(d.rg!==undefined){rng=+d.rg;render()}
};

/* ---------- Artikel bearbeiten ---------- */
function showPrev(){const u=rmImg?null:curImg;$('prev').hidden=!u;if(u)$('pimg').src=u}
function openModal(id){
  const i=id?items.find(x=>x.id===id):null;editing=i?i.id:null;armed=false;rmImg=false;curImg=i?i.image:null;
  $('mt').textContent=i?'Artikel bearbeiten':'Neuer Artikel';
  $('name').value=i?i.name:'';$('buy').value=i&&i.buy?i.buy:'';$('extra').value=i&&i.extra?i.extra:'';
  $('bDate').value=i?i.b_date:today();$('sell').value=i&&i.sell!=null?i.sell:'';$('sDate').value=i&&i.s_date?i.s_date:'';
  $('file').value='';$('del').hidden=!i;$('del').textContent='Löschen';$('del').classList.remove('arm');
  showPrev();$('modal').hidden=false;
}
function closeModal(){$('modal').hidden=true}
$('fab').onclick=()=>openModal(null);
$('cx').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeModal()});
$('rm').onclick=()=>{rmImg=true;showPrev()};
$('file').onchange=()=>{const fl=$('file').files[0];if(fl){$('pimg').src=URL.createObjectURL(fl);$('prev').hidden=false;rmImg=false}};

async function upImg(file){
  const bmp=await createImageBitmap(file),sc=Math.min(1,800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  const path=user.id+'/'+crypto.randomUUID()+'.jpg';
  const{error}=await sb.storage.from('items').upload(path,blob,{contentType:'image/jpeg'});
  if(error)throw error;
  return sb.storage.from('items').getPublicUrl(path).data.publicUrl;
}
$('save').onclick=async()=>{
  const name=$('name').value.trim();if(!name){$('name').focus();return}
  $('save').disabled=true;
  try{
    const sr=$('sell').value.trim();
    const o={name,buy:num($('buy').value),extra:num($('extra').value),b_date:$('bDate').value||today(),sell:sr===''?null:num(sr),s_date:$('sDate').value||null};
    if(o.sell!=null&&!o.s_date)o.s_date=today();
    if(o.sell==null)o.s_date=null;
    const fl=$('file').files[0];
    if(fl)o.image=await upImg(fl);else if(rmImg)o.image=null;
    const{error}=editing?await sb.from('items').update(o).eq('id',editing):await sb.from('items').insert(o);
    if(error)throw error;
    await load();closeModal();render();
  }catch(e){toast('Fehler: '+(e.message||e))}
  $('save').disabled=false;
};
$('del').onclick=async()=>{
  if(!armed){armed=true;$('del').textContent='Wirklich löschen?';$('del').classList.add('arm');return}
  const{error}=await sb.from('items').delete().eq('id',editing);
  if(error){toast('Fehler: '+error.message);return}
  await load();closeModal();render();
};
